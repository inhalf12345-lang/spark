<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark - Social Reward Chat</title>
    <meta name="description" content="A gamified social chat app with glowing orbital home hub, spark burst messages, and virtual coin rewards powered by Supabase." />
    <meta property="og:title" content="Spark - Social Reward Chat" />
    <meta property="og:description" content="A gamified social chat app with glowing orbital home hub, spark burst messages, and virtual coin rewards powered by Supabase." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-slate-800">
    <div id="root"></div>
    <script>
      (function () {
        var loaded = false;
        window.__sparkLoadStaticBundle = function () {
          if (loaded) return;
          loaded = true;
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './public/gh-pages-bundle/app.css';
          css.onerror = function () {
            var altCss = document.createElement('link');
            altCss.rel = 'stylesheet';
            altCss.href = './assets/app.css';
            document.head.appendChild(altCss);
          };
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.crossOrigin = 'anonymous';
          js.src = './public/gh-pages-bundle/app.js';
          js.onerror = function () {
            var altJs = document.createElement('script');
            altJs.type = 'module';
            altJs.crossOrigin = 'anonymous';
            altJs.src = './assets/app.js';
            document.body.appendChild(altJs);
          };
          document.body.appendChild(js);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__sparkLoadStaticBundle && window.__sparkLoadStaticBundle()"></script>
    <script>
      (function () {
        var isViteDev = Boolean(document.querySelector('script[src*="@vite/client"]'));
        var hasRawTsx = Boolean(document.querySelector('script[src*="/src/main.tsx"]'));
        if (!isViteDev && hasRawTsx && window.location.hostname.indexOf('github.io') !== -1) {
          window.__sparkLoadStaticBundle();
        } else if (!isViteDev) {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && !root.hasChildNodes() && window.__sparkLoadStaticBundle) {
              window.__sparkLoadStaticBundle();
            }
          }, 1500);
        }
      })();
    </script>
  </body>
</html>
