<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark - Social Reward Chat</title>
    <meta name="description" content="A gamified social chat app with glowing orbital home hub, spark burst messages, and virtual coin rewards powered by Supabase." />
    <meta property="og:title" content="Spark - Social Reward Chat" />
    <meta property="og:description" content="A gamified social chat app with glowing orbital home hub, spark burst messages, and virtual coin rewards powered by Supabase." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      (function () {
        // Fallback loader for GitHub Pages or static hosts where browsers cannot directly execute raw typescript (.tsx)
        function loadCompiledBundle() {
          if (document.getElementById('spark-bundle-js')) return;
          var link = document.createElement('link');
          link.id = 'spark-bundle-css';
          link.rel = 'stylesheet';
          link.href = './gh-pages-bundle/app.css';
          document.head.appendChild(link);

          var s = document.createElement('script');
          s.id = 'spark-bundle-js';
          s.type = 'module';
          s.src = './gh-pages-bundle/app.js';
          document.body.appendChild(s);
        }

        // Check if raw typescript script fails or if running on github.io / static deployment
        var isStaticHost = window.location.hostname.indexOf('github.io') !== -1 ||
          window.location.protocol === 'file:' ||
          !window.location.port;

        if (isStaticHost) {
          // If the page is still blank after 800ms, load the compiled bundle
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && (!root.childNodes || root.childNodes.length === 0 || root.innerText.trim() === '')) {
              loadCompiledBundle();
            }
          }, 800);
        }

        window.addEventListener('error', function (e) {
          if (e && e.filename && e.filename.indexOf('main.tsx') !== -1) {
            loadCompiledBundle();
          }
        }, true);
      })();
    </script>
  </body>
</html>
