<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark By Utkrist</title>
    <meta name="description" content="A gamified social chat app with glowing orbital home hub, spark burst messages, and virtual coin rewards powered by Supabase." />
    <meta property="og:title" content="Spark - Social Reward Chat" />
    <meta property="og:description" content="A gamified social chat app with glowing orbital home hub, spark burst messages, and virtual coin rewards powered by Supabase." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ff3b69" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spark" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-slate-800" style="margin:0;padding:0;min-height:100vh;background:linear-gradient(135deg,#7ad1f9 0%,#d8b4fe 45%,#f472b6 80%,#fb7185 100%);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;">
    <div id="root"></div>
    <script>
      (function () {
        var loaded = false;
        function loadCssChain(urls, idx) {
          if (idx >= urls.length) return;
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = urls[idx];
          link.onerror = function () {
            loadCssChain(urls, idx + 1);
          };
          document.head.appendChild(link);
        }
        function loadJsChain(urls, idx) {
          if (idx >= urls.length || window.__SPARK_MOUNTED__) return;
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = urls[idx];
          script.onerror = function () {
            loadJsChain(urls, idx + 1);
          };
          document.body.appendChild(script);
        }
        window.__sparkLoadStaticBundle = function () {
          if (loaded || window.__SPARK_MOUNTED__) return;
          loaded = true;
          var cssUrls = ['./public/gh-pages-bundle/app.css', './gh-pages-bundle/app.css', './assets/app.css'];
          var jsUrls = ['./public/gh-pages-bundle/app.js', './gh-pages-bundle/app.js', './assets/app.js'];
          loadCssChain(cssUrls, 0);
          loadJsChain(jsUrls, 0);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__sparkLoadStaticBundle && window.__sparkLoadStaticBundle()"></script>
    <script>
      (function () {
        var isViteDev = Boolean(document.querySelector('script[src*="@vite/client"]'));
        var hasRawTsx = Boolean(document.querySelector('script[src*="/src/main.tsx"]'));
        if (!isViteDev && hasRawTsx && window.__sparkLoadStaticBundle) {
          window.__sparkLoadStaticBundle();
        }
      })();
    </script>
  </body>
</html>
