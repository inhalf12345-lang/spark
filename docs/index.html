<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark - Social Reward Chat</title>
    <meta name="description" content="A gamified social chat app with glowing orbital home hub, spark burst messages, and virtual coin rewards powered by Supabase." />
    <meta property="og:title" content="Spark - Social Reward Chat" />
    <meta property="og:description" content="A gamified social chat app with glowing orbital home hub, spark burst messages, and virtual coin rewards powered by Supabase." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    
    <!-- Automatic static host detector for GitHub Pages & static root deployments -->
    <script>
      (function() {
        var isStaticHost = window.location.hostname.indexOf('github.io') !== -1 ||
          window.location.protocol === 'file:' ||
          (!window.location.port && window.location.hostname !== 'localhost');
        
        window.__SPARK_STATIC_DEPLOYMENT__ = isStaticHost;

        // Only inject fallback CSS if Vite's production link tag is not present
        if (isStaticHost && !document.querySelector('link[href*="index-"]')) {
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.id = 'spark-static-css';
          css.href = './gh-pages-bundle/app.css';
          document.head.appendChild(css);
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-BeaS6HZr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DjIOMHRi.css">
  </head>
  <body class="bg-[#0f172a] text-slate-100">
    <div id="root">
      <!-- Instant inline fallback splash while JavaScript modules load (prevents blank screen) -->
      <div id="spark-boot-loader" style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #7ad1f9 0%, #d8b4fe 40%, #f472b6 75%, #fb7185 100%); color: #0f172a; text-align: center; padding: 20px; box-sizing: border-box;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(244, 114, 182, 0.4); margin-bottom: 16px;">
          <span style="font-size: 30px;">⚡</span>
        </div>
        <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 6px 0; color: #0f172a; letter-spacing: -0.5px;">Spark</h1>
        <p style="font-size: 13px; font-weight: 500; margin: 0; color: #475569;">Initializing real chat engine...</p>
      </div>
    </div>

    <!-- Development Vite Entry Point -->

    <!-- Static Host Bundle Fallback (Only runs if Vite production bundle script is not already present) -->
    <script>
      (function() {
        if (window.__SPARK_STATIC_DEPLOYMENT__ && !document.querySelector('script[src*="assets/index-"]')) {
          var bundleScript = document.createElement('script');
          bundleScript.type = 'module';
          bundleScript.id = 'spark-bundle-loader';
          bundleScript.src = './gh-pages-bundle/app.js';
          document.body.appendChild(bundleScript);
        }
      })();
    </script>
  </body>
</html>
